<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ECONOMY ESCAPE | 경제 릴레이 방탈출</title><style>
:root{--bg:#f7f5ef;--paper:#fffefa;--ink:#292b29;--muted:#777b75;--line:#deded7;--sage:#526f60;--accent:#d9a65c;--red:#a54e46}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,'Noto Sans KR',system-ui,sans-serif;line-height:1.55}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:white;color:var(--ink)}button:hover{border-color:var(--sage)}button.primary{background:var(--sage);color:white;border-color:var(--sage)}button.warn{background:#fff1eb;color:var(--red)}button:disabled{opacity:.5;cursor:not-allowed}.wrap{max-width:1150px;margin:auto;padding:28px 20px 80px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.eyebrow{font-size:12px;letter-spacing:.2em;color:var(--sage);font-weight:750}.title{font-size:clamp(27px,4vw,44px);line-height:1.2;margin:9px 0}.sub{color:var(--muted)}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:22px;margin-top:18px;box-shadow:0 6px 22px #3b463608}.grid{display:grid;grid-template-columns:290px 1fr;gap:18px}.pill{display:inline-flex;align-items:center;gap:6px;background:#edf0e9;color:#425c4c;border-radius:100px;padding:5px 11px;font-size:12px;font-weight:700}.nav{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.nav button{padding:12px 5px;font-weight:750}.nav button.current{background:var(--sage);color:white}.nav button.answered:not(.current){background:#e7eee6}.num{font-size:13px;color:var(--muted)}.question{font-size:19px;font-weight:700;margin:12px 0 18px;white-space:pre-line}.choices{display:grid;gap:9px}.choice{text-align:left;display:flex;gap:10px;align-items:center;padding:13px}.choice.active{border:2px solid var(--sage);background:#eef3ee}.choice b{font-size:12px;border:1px solid var(--line);border-radius:7px;min-width:27px;height:27px;display:grid;place-items:center}.field{width:100%;padding:13px;border:1px solid #c9 // 문제 수정: 아래 QUESTIONS 배열의 question, options, answer, explanation, hint를 편집하세요.
// type: 'choice' / 'number' / 'text'; answer는 객관식의 경우 0부터 시작하는 선택지 인덱스입니다.
const QUESTIONS=[
{unit:'자본주의',type:'choice',question:'사유 재산 제도를 바탕으로 시장을 통해 경제 문제를 해결하는 체제는?',options:['계획경제체제','자본주의 경제체제','전통경제체제','명령경제체제'],answer:1,hint:'생산 수단의 사적 소유와 시장의 역할을 함께 생각하세요.',explanation:'부교재는 자본주의를 사유 재산 제도를 바탕으로 시장을 통해 경제의 기본 문제를 해결하는 체제로 설명합니다.'},
{unit:'자본주의',type:'choice',question:'18세기 산업혁명 이후 기계 공업과 대량 생산을 바탕으로 발전한 자본주의는?',options:['상업 자본주의','수정 자본주의','산업 자본주의','신자유주의'],answer:2,hint:'상품의 유통보다 생산 과정에서 이윤을 추구한 시기를 떠올려 보세요.',explanation:'산업혁명 이후 기계 공업을 중심으로 산업 자본주의가 발전했습니다.'},
{unit:'자본주의',type:'choice',question:'대공황 이후 정부의 적극적인 시장 개입을 강조한 자본주의 형태는?',options:['수정 자본주의','상업 자본주의','독점 자본주의','자유방임주의'],answer:0,hint:'뉴딜 정책과 케인스의 주장을 생각하세요.',explanation:'수정 자본주의는 시장 실패를 완화하기 위한 적극적인 정부 개입을 강조합니다.'},
{unit:'자본주의',type:'choice',key:true,letters:['A','L','N','S'],question:'다음 중 시장경제의 특징에 해당하는 것의 개수는?\nㄱ. 사유 재산권 보장\nㄴ. 직업 선택의 자유\nㄷ. 모든 생산량을 정부가 직접 결정\nㄹ. 시장에서의 자유로운 경쟁\nㅁ. 시장 가격에 따른 거래',options:['4개','3개','2개','5개'],answer:0,hint:'정부의 전면적 생산 명령은 시장경제의 핵심 특징인지 살펴보세요.',explanation:'ㄱ, ㄴ, ㄹ, ㅁ의 네 가지가 시장경제의 특징입니다.'},
{unit:'합리적 선택',type:'choice',question:'어떤 선택으로 포기한 대안 중 가장 가치가 큰 것과 직접 지출한 비용을 함께 고려하는 개념은?',options:['매몰비용','기회비용','평균비용','고정비용'],answer:1,hint:'선택 때문에 포기한 것의 가치를 고려하는 비용입니다.',explanation:'기회비용은 명시적 비용과 암묵적 비용의 합입니다.'},
{unit:'합리적 선택',type:'number',question:'공연 관람료 2만 원을 내고 공연을 보려 한다. 같은 시간 아르바이트를 했다면 3만 원을 벌 수 있었다. 공연 관람의 기회비용은 몇 만 원인가?',answer:5,hint:'직접 낸 돈과 포기한 소득을 모두 합하세요.',explanation:'명시적 비용 2만 원 + 암묵적 비용 3만 원 = 5만 원입니다.'},
{unit:'합리적 선택',type:'choice',question:'이미 지출하여 되돌려 받을 수 없는 비용으로, 현재의 합리적 선택에서 고려하지 않아야 하는 것은?',options:['명시적 비용','암묵적 비용','매몰비용','기회비용'],answer:2,hint:'과거에 발생해 회수할 수 없는 지출을 떠올리세요.',explanation:'매몰비용은 회수할 수 없는 과거의 비용이므로 현재 선택에서 제외해야 합니다.'},
{unit:'합리적 선택',type:'choice',key:true,letters:['E','F','P','G'],question:'어떤 선택의 편익은 11만 원, 명시적 비용은 6만 원, 암묵적 비용은 3만 원이다. 순편익은 얼마인가?',options:['2만 원','3만 원','5만 원','8만 원'],answer:0,hint:'편익에서 기회비용을 빼세요.',explanation:'기회비용은 6+3=9만 원, 순편익은 11-9=2만 원입니다.'},
{unit:'시장 실패',type:'choice',question:'다른 사람이 이 재화를 소비하더라도 내가 소비할 수 있는 양이 줄어들지 않고, 대가를 지불하지 않은 사람을 소비에서 배제하기도 어려운 재화는?',options:['사적재화','공공재','클럽재','공유자원'],answer:1,hint:'소비자끼리 이용을 두고 경쟁하는지, 비용을 내지 않은 사람을 이용에서 막을 수 있는지 생각하세요.',explanation:'다른 사람의 소비가 내 소비를 줄이지 않는 성질은 비경합성, 비용을 내지 않은 사람을 배제하기 어려운 성질은 비배제성입니다. 두 특성을 모두 지닌 재화는 공공재입니다.'},
{unit:'시장 실패',type:'choice',question:'공장 매연이 주변 주민에게 피해를 주지만 그 피해에 대한 대가를 지급하지 않는 경우는?',options:['긍정적 외부 효과','부정적 외부 효과','공공재 공급','정보의 대칭성'],answer:1,hint:'제3자에게 보상 없는 피해가 발생하는지 보세요.',explanation:'공장 매연으로 인한 제3자의 피해는 부정적 외부 효과입니다.'},
{unit:'시장 실패',type:'choice',question:'예방접종처럼 사회에 긍정적 외부 효과가 발생하는 활동을 늘리기 위한 정부 정책으로 가장 적절한 것은?',options:['보조금 지급','생산 금지','일률적인 벌금 부과','관련 정보 차단'],answer:0,hint:'사회적으로 바람직한 활동을 장려하는 수단을 고르세요.',explanation:'긍정적 외부 효과에는 보조금과 세금 감면 등 긍정적 유인이 적절합니다.'},
{unit:'시장 실패',type:'choice',key:true,letters:['K','P','G','D'],question:'다음 중 시장 실패 사례의 개수는?\n① 독점 기업의 가격 인상\n② 무임승차로 인한 공공재 부족\n③ 공장 오염으로 인한 주변 이웃의 피해\n④ 사회적으로 과대 공급되는 예방접종',options:['3개','2개','4개','1개'],answer:0,hint:'예방접종의 긍정적 외부 효과를 고려하세요.',explanation:'① 독점, ② 공공재의 무임승차, ③ 부정적 외부 효과는 시장 실패 사례입니다. 예방접종은 긍정적 외부 효과 때문에 일반적으로 사회적 최적 수준보다 과소 공급될 수 있으므로 ④는 틀렸습니다.'},
{unit:'지속가능성과 금융',type:'choice',question:'기업이 이윤 추구 외에도 노동자와 소비자의 권리를 존중하고 지역사회에 공헌하는 활동은?',options:['사회적 책임','독점적 지배','무임승차','비관세 장벽'],answer:0,hint:'기업의 경제적 역할 외에 사회적 의무를 떠올려 보세요.',explanation:'기업의 사회적 책임은 법규 준수, 이해관계자 존중, 지역사회 공헌 등을 포함합니다.'},

{unit:'국제 무역',type:'choice',question:'어떤 나라가 두 상품 모두 절대우위를 가진 경우에 대한 설명으로 옳은 것은?',options:['교역 이익이 불가능하다','비교우위에 따른 특화와 교역으로 양국 모두 이익을 얻을 수 있다','반드시 두 상품을 모두 수입한다','기회비용은 항상 동일하다'],answer:1,hint:'절대우위와 비교우위는 다른 개념입니다.',explanation:'한 나라가 모든 상품에서 절대우위를 가져도 상대적 기회비용 차이가 있으면 교역 이익이 가능합니다.'},

const sbHeaders=(auth=false)=>({'apikey':SB_KEY,'Content-Type':'application/json',...(auth&&sbToken?{'Authorization':'Bearer '+sbToken}:{})});
async function sbRequest(path,opts={},auth=false){let r=await fetch(SB_URL+path,{...opts,headers:{...sbHeaders(auth),...(opts.headers||{})}});let body=await r.text();let parsed;try{parsed=body?JSON.parse(body):null}catch{parsed=body}if(!r.ok)throw Error((parsed&&parsed.message)||(parsed&&parsed.error_description)||('HTTP '+r.status));return parsed}
async function fetchSettings(quiet=false){try{let rows=await sbRequest('/rest/v1/game_settings?id=eq.1&select=runner_minutes,collaboration_minutes,runners,updated_at');if(!rows||!rows.length)throw Error('설정 데이터 없음');let v=rows[0];data.settings={runners:v.runners||5,roundMin:v.runner_minutes,coopMin:v.collaboration_minutes};settingsLoaded=true;remoteStatus='연결됨';save();if(view==='home'&&!quiet)render();return true}catch(e){remoteStatus='연결 실패: '+e.message;if(!quiet)console.warn(remoteStatus);return false}}
async function ensureSettings(){if(settingsLoaded)return true;return await fetchSettings(true)}
async function fetchRemoteResults(){if(!sbToken)return;try{remoteResults=await sbRequest('/rest/v1/team_results?select=team_name,score,submitted_at&order=submitted_at.desc',{},true);if(view==='teacher')render()}catch(e){console.warn('결과 조회 실패',e)}}
async function sendResult(t){try{let r=await sbRequest('/rest/v1/team_results',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify({team_name:data.active,score:score(t)})});t.synced=true;save();return true}catch(e){console.warn('결과 전송 실패',e);t.synced=false;save();alert('채점은 완료됐지만 서버에 점수를 저장하지 못했습니다. 인터넷 연결 및 Supabase 정책을 확인하세요. ('+e.message+')');return false}}
async function teacherLogin(){let email=document.getElementById('teacherEmail').value.trim(),password=document.getElementById('teacherPass').value;if(!email||!password)return alert('이메일과 비밀번호를 입력하세요.');try{let auth=await sbRequest('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})});sbToken=auth.access_token;sbRefresh=auth.refresh_token;teacherAuthed=true;closeOverlay();view='teacher';render();fetchRemoteResults()}catch(e){alert('Supabase 교사 로그인 실패: '+e.message)}}
async function saveSettings(){if(!sbToken)return alert('교사 로그인이 필요합니다.');let runners=+document.getElementById('runners').value,roundMin=+document.getElementById('roundMin').value,coopMin=+document.getElementById('coopMin').value;if(![runners,roundMin,coopMin].every(Number.isInteger)||runners<1||runners>10||roundMin<1||roundMin>30||coopMin<1||coopMin>60)return alert('주자 수 1~10명, 주자 시간 1~30분, 협력 시간 1~60분으로 설정하세요.');try{await sbRequest('/rest/v1/game_settings?id=eq.1',{method:'PATCH',headers:{'Prefer':'return=representation'},body:JSON.stringify({runners,runner_minutes:roundMin,collaboration_minutes:coopMin,updated_at:new Date().toISOString()})},true);await fetchSettings(true);alert('서버에 저장되었습니다. 학생 기기에도 자동으로 전달됩니다. (진행 중인 타이머는 유지)');render()}catch(e){alert('서버 저장 실패: '+e.message+'\n관리자 권한 SQL을 확인하세요.')}}
async function joinTeam(){let n=document.getElementById('teamName').value.trim();if(!n)return alert('모둠 이름을 입력하세요.');if(!(await ensureSettings()))return alert('공통 수업 설정을 서버에서 읽지 못했습니다. 인터넷 연결을 확인한 후 다시 시도하세요.\n'+remoteStatus);if(!data.teams[n])data.teams[n]={answers:Array(24).fill(''),runner:1,phase:'waiting',nextPhase:'relay',startedAt:null,deadline:null,code:'',submittedAt:null};data.active=n;save();view='play';page=0;render()}
async function resumeNext(){let t=current();if(!t||t.phase!=='waiting')return;if(!(await fetchSettings(true)))return alert('서버 설정을 불러오지 못했습니다. 연결 확인 후 다시 눌러 주세요.');t.phase=t.nextPhase||'relay';t.deadline=Date.now()+(t.phase==='coop'?data.settings.coopMin:data.settings.roundMin)*60000;t.startedAt=Date.now();save();render()}
function showTeacherLogin(){if(teacherAuthed){view='teacher';render();fetchRemoteResults();return}document.getElementById('overlay').innerHTML=`<div class="modal"><section class="card"><h2>🔐 교사 로그인</h2><p class="sub">Supabase Authentication에 등록한 교사 계정으로 로그인하세요.</p><label>교사 이메일</label><input id="teacherEmail" class="field" type="email" autocomplete="username" placeholder="teacher@example.com"><div class="spacer"></div><label>관리자 비밀번호</label><input id="teacherPass" class="field" type="password" autocomplete="current-password"><div class="spacer"></div><div class="row"><button onclick="closeOverlay()">취소</button><button class="primary" onclick="teacherLogin()">로그인</button></div></section></div>`}
function renderTeacher(){let ts=[...Object.entries(data.teams),...Object.entries(data.importedTeams||{}).filter(([n])=>!data.teams[n])];app(`<section class="card"><span class="pill">🔐 교사 운영실 · Supabase 연동</span><h2>수업 운영 대시보드</h2><p class="notice small">공통 설정은 Supabase에 저장되며 학생 기기는 단계 시작 시 최신 설정을 읽습니다. 이미 시작된 타이머는 변경되지 않습니다.</p><div class="teacher-controls"><label>모둠원 수(주자 수)<input id="runners" class="field" type="number" min="1" max="10" value="${data.settings.runners}"></label><label>주자당 제한 시간(분)<input id="roundMin" class="field" type="number" min="1" max="30" value="${data.settings.roundMin}"></label><label>협력 시간(분)<input id="coopMin" class="field" type="number" min="1" max="60" value="${data.settings.coopMin}"></label><div style="display:flex;align-items:end"><button class="primary" style="width:100%" onclick="saveSettings()">서버에 설정 저장</button></div></div><div class="divider"></div><h3>📊 서버에 제출된 모둠 점수</h3><div class="row"><button onclick="fetchRemoteResults()">서버 결과 새로고침</button></div><table class="results"><thead><tr><th>모둠</th><th>점수 / 270</th><th>제출 시각</th></tr></thead><tbody>${remoteResults.map(x=>`<tr><td>${esc(x.team_name)}</td><td><b>${x.score}</b></td><td>${esc(new Date(x.submitted_at).toLocaleString('ko-KR'))}</td></tr>`).join('')||'<tr><td colspan="3">서버 제출 결과가 없습니다.</td></tr>'}</tbody></table><div class="divider"></div><h3>이 기기의 진행 현황</h3><table class="results"><thead><tr><th>모둠</th><th>단계</th><th>작성</th><th>점수</th></tr></thead><tbody>${ts.map(([n,t])=>`<tr><td>${esc(n)}</td><td>${esc(t.phase)}</td><td>${count(t)}/24</td><td>${['submitted','expired'].includes(t.phase)?score(t)+'점':'비공개'}</td></tr>`).join('')||'<tr><td colspan="4">이 기기의 기록이 없습니다.</td></tr>'}</tbody></table><div class="row"><button onclick="downloadResults()">결과 JSON 내려받기</button><button onclick="view='results';render()">이 기기 순위표</button><button onclick="print()">인쇄</button><button class="warn" onclick="resetAll()">이 기기 기록 초기화</button></div><div class="divider"></div><h3>정답·해설 관리</h3><button onclick="toggleAnswerKey()">정답표 표시 / 숨기기</button><div id="answerKey" class="hidden">${QUESTIONS.map((q,i)=>`<div class="review"><b>${i+1}. ${esc(q.question)}</b><p class="small">정답: ${esc(q.type==='choice'?q.options[q.answer]:q.answer)} · ${esc(q.explanation)}</p></div>`).join('')}<b>최종 암호: ${SECRET}</b></div></section>`);}
async function refreshTeacherToken(){if(!sbRefresh)return;try{let a=await sbRequest('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:sbRefresh})});sbToken=a.access_token;sbRefresh=a.refresh_token}catch(e){teacherAuthed=false;sbToken=null;sbRefresh=null;console.warn('교사 로그인 만료',e)}}
setInterval(()=>{if(view==='home')fetchSettings(true);if(teacherAuthed)fetchRemoteResults()},15000);
setInterval(refreshTeacherToken,40*60*1000);
fetchSettings(false);
function load(){try{return JSON.parse(localStorage.getItem(STORAGE))||{teams:{},active:null,settings:{runners:5,roundMin:1,coopMin:10}}}catch{return {teams:{},active:null,settings:{runners:5,roundMin:1,coopMin:10}}}}
function save(){localStorage.setItem(STORAGE,JSON.stringify(data))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function app(s){document.getElementById('app').innerHTML=s}function current(){return data.teams[data.active]}function getAnswer(q){let t=current();return t?t.answers[q]??'':''}function isFilled(a){return a!==''&&a!==null&&a!==undefined}function norm(s){return String(s).trim().replace(/\s/g,'').toLowerCase()}function correct(q,a){if(!isFilled(a))return false;let item=QUESTIONS[q];return item.type==='choice'?Number(a)===item.answer:(norm(a)===norm(item.answer)||(item.type==='number'&&isFilled(a)&&Math.abs(parseFraction(a)-parseFraction(item.answer))<0.00001))}function parseFraction(v){let z=String(v).trim().split('/');return z.length===2?Number(z[0])/Number(z[1]):Number(v)}function score(t){return t.answers.reduce((n,a,i)=>n+(correct(i,a)?10:0),0)+(t.code===SECRET?30:0)}function count(t){return t.answers.filter(isFilled).length}function goHome(){view='home';render()}function render(){if(view==='home')return renderHome();if(view==='play')return renderPlay();if(view==='teacher')return renderTeacher();if(view==='results')return renderResults()}
function renderHome(){let names=Object.keys(data.teams);app(`<section class="card"><span class="pill">🔐 미션 시작</span><h2>경제 질서 복구팀에 합류하세요.</h2><p class="sub">각 모둠은 지정된 한 대의 기기에서 주자를 교대합니다. 릴레이 중에는 혼자 풀고, 협력 시간에 함께 검토하세요.</p><div class="notice small">Supabase 공통 설정 연동 · 주자 시작 시 최신 교사 설정을 적용합니다. 모둠 제출 점수는 서버에 전송됩니다. 인터넷 연결이 필요합니다.</div><div class="spacer"></div><label>모둠 이름</label><div class="row"><input id="teamName" class="field" style="flex:1;min-width:180px" placeholder="예: 1모둠" maxlength="30"><button class="primary" onclick="joinTeam()">모둠 시작</button></div>${names.length?`<div class="divider"></div><b>이 기기에 저장된 모둠</b><div class="spacer"></div><div class="list">${names.map(n=>`<button style="text-align:left" onclick="openTeam('${encodeURIComponent(n)}')">${esc(n)} · ${count(data.teams[n])}/24문항 작성 · ${esc(data.teams[n].phase==='submitted'?'제출 완료':'진행 중')}</button>`).join('')}</div>`:''}</section><section class="card"><h3>📜 게임 규칙</h3><p>① 주자별로 제한 시간 동안 <b>혼자</b> 문제를 풉니다. ② 다음 주자는 이전 답안을 이어받습니다. ③ 협력 시간에 모둠 전체가 보완합니다. ④ 암호 6자리를 입력하고 최종 제출합니다.</p><p class="small sub">문항 24개 × 10점 + 암호 성공 30점 = 총 270점</p></section>`)}
function openTeam(encoded){data.active=decodeURIComponent(encoded);save();view='play';page=0;render()}
function remaining(t){return t.deadline?Math.max(0,Math.ceil((t.deadline-Date.now())/1000)):0}function formatTime(s){return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function pauseForNext(t){t.phase='waiting';t.deadline=null;save();render()}
function renderWaiting(t){let coop=t.nextPhase==='coop';app(`<section class="card" style="max-width:750px;margin:36px auto;text-align:center;padding:48px 25px"><div class="lock">${coop?'🏠':'🔁'}</div><h2>${coop?'모든 주자의 릴레이가 끝났습니다!':`${t.runner}번 주자 대기 중`}</h2><p class="sub">${coop?'기기를 들고 모둠 자리로 돌아가세요. 모둠원 모두가 모이면 협력 풀이를 시작하세요.':'앞 주자는 기기에서 물러나고, 다음 주자가 풀이 장소에 도착하면 시작 버튼을 누르세요.'}</p><p class="notice">${coop?'모둠원 전체가 모인 뒤에만 협의할 수 있습니다.':'다음 주자가 도착하기 전까지 문제와 답안은 가려집니다.'}</p><button class="primary" style="font-size:19px;padding:17px 30px" onclick="resumeNext()">${coop?'모둠 자리 도착 · 협력 풀이 시작':'풀이시작'}</button></section>`)}
function cluesReady(t){return (t.phase==='coop'&&(count(t)===24||remaining(t)<=40))||t.phase==='submitted'||t.phase==='expired'}
function clueColorFor(i){let pos=KEY_QUESTIONS.indexOf(i);return pos<0?null:CLUE_COLORS[pos]}
function derivedCode(t){return NOTE_ORDER.map(ix=>{let qi=KEY_QUESTIONS[ix],q=QUESTIONS[qi],a=t.answers[qi];return isFilled(a)?(q.letters?.[Number(a)]||''):''}).join('')}
function syncAutomaticCode(t){if(t.phase==='coop'&&count(t)===24){t.code=derivedCode(t);return true}return false}
function notebook(t){let ready=cluesReady(t),automatic=t.phase==='coop'&&count(t)===24,letters=automatic?NOTE_ORDER.map(ix=>{let qi=KEY_QUESTIONS[ix],q=QUESTIONS[qi];return q.letters?.[Number(t.answers[qi])]||'?'}):null;return `<div class="divider"></div><b>🔐 암호 수첩</b><p class="small sub">${ready?automatic?'24문항을 모두 작성했습니다! 선택한 답안에 따라 암호가 자동 완성되었습니다. 오답이 있다면 암호도 달라질 수 있으니 확인하세요.':'빛나는 문제의 선택지에 표시된 알파벳을 확인하고, 같은 색 칸의 순서대로 암호를 완성하세요.':'모든 문제에 답하거나 협력 시간이 40초 이하로 남으면 단서가 공개됩니다.'}</p><div class="cluebook">${NOTE_ORDER.map(ix=>`<div class="cluecell" aria-label="암호 칸" style="${ready?`background:color-mix(in srgb,${CLUE_COLORS[ix].hex} 24%,white);border-color:${CLUE_COLORS[ix].hex}`:''}"><strong>${automatic?letters[NOTE_ORDER.indexOf(ix)]:'?'}</strong></div>`).join('')}</div>`}
function isEditable(t){return t&&(t.phase==='relay'||(t.phase==='coop'&&remaining(t)>0))}
function expireCoop(t){if(!t||t.phase!=='coop'||remaining(t)>0)return;t.phase='expired';t.deadline=null;t.submittedAt=Date.now();save();sendResult(t);clearInterval(clockHandle);render();document.getElementById('overlay').innerHTML=`<div class="modal"><section class="card"><div class="lock">⏰</div><h2>협력 시간 종료 · 자동 채점 완료</h2><p>이제 답안 수정과 암호 입력, 추가 제출은 불가능합니다.</p><p><b>${esc(data.active)} · ${score(t)} / 270점</b></p><button class="primary" onclick="closeOverlay()">결과 확인</button></section></div>`}
function renderPlay(){let t=current();if(!t)return goHome();if(syncAutomaticCode(t))save();if(t.phase==='waiting')return renderWaiting(t);if(t.phase==='coop'&&remaining(t)===0)return expireCoop(t);let done=t.phase==='submitted'||t.phase==='expired',ready=cluesReady(t),q=QUESTIONS[page],ans=getAnswer(page);app(`<div class="card"><div class="top"><div><span class="pill">${esc(data.active)}</span> <span class="pill">${t.phase==='relay'?`🏃 ${t.runner}번 주자 · 개인 풀이`:t.phase==='coop'?'🤝 모둠 협력':'🏁 제출 완료'}</span></div><div class="row"><span class="big timer" id="timer">${done?'완료':formatTime(remaining(t))}</span><button onclick="changeRunner()" ${done?'disabled':''}>${t.phase==='relay'?'주자 교체':'협력 종료 · 제출'}</button></div></div><div class="spacer"></div><div class="meter"><div style="width:${count(t)/24*100}%"></div></div><div class="small sub" style="margin-top:8px">작성 ${count(t)}/24문항 · ${t.phase==='relay'?'다른 모둠원의 도움 없이 풀어 주세요.':t.phase==='coop'?'이제 모둠원끼리 상의할 수 있습니다.':'채점 결과를 확인하세요.'}</div></div><div id="countdownNotice" class="notice hidden" role="alert"></div><div class="grid"><aside><section class="card"><b>문제 목록</b><p class="small sub">문제 번호를 선택하여 풀어 주세요.</p><div class="nav">${QUESTIONS.map((x,i)=>{let c=ready?clueColorFor(i):null;return `<button class="${i===page?'current':isFilled(t.answers[i])?'answered':''} ${c?'glow':''}" style="${c?`--glow:${c.hex};`:''}" onclick="page=${i};showHint=false;render()">${i+1}</button>`}).join('')}</div>${notebook(t)}<label>최종 6글자 영문 암호</label><input class="field code" maxlength="6" autocapitalize="characters" placeholder="······" value="${esc(t.code)}" ${!isEditable(t)||t.phase!=='coop'||count(t)===24?'disabled':''} oninput="setCode(this.value)"><div class="spacer"></div><button class="primary" style="width:100%" onclick="submitTeam()" ${!isEditable(t)||t.phase!=='coop'?'disabled':''}>최종 제출 및 채점</button></section></aside><section class="card"><div class="top"><span class="pill">QUESTION ${String(page+1).padStart(2,'0')} / 24</span><span class="small sub">${esc(q.unit)} ${ready&&q.key?'· ✨ 암호 단서':''}</span></div><div class="question">${esc(q.question)}</div>${q.type==='choice'?`<div class="choices">${q.options.map((o,i)=>`<button class="choice ${String(ans)===String(i)?'active':''}" ${!isEditable(t)?'disabled':''} onclick="setAnswer(${page},'${i}')"><b>${esc(q.letters?.[i]||'ABCD'[i])}</b>${esc(o)}</button>`).join('')}</div>`:`<input class="field" id="numericAnswer" ${q.type==='number'?'inputmode="decimal"':'type="text"'} placeholder="정답 입력" value="${esc(ans)}" ${!isEditable(t)?'disabled':''} oninput="setAnswer(${page},this.value,false)">`}<div class="spacer"></div><div class="row between">${page<12?`<button onclick="showHint=!showHint;render()">💡 힌트 ${showHint?'닫기':'보기'}</button>`:''}<div class="row"><button onclick="page=Math.max(0,page-1);showHint=false;render()" ${page===0?'disabled':''}>이전</button><button class="primary" onclick="page=Math.min(23,page+1);showHint=false;render()" ${page===23?'disabled':''}>다음 문제</button></div></div>${showHint&&page<12?`<div class="hint">${esc(q.hint)}</div>`:''}${done?`<div class="divider"></div><b class="${correct(page,ans)?'good':'bad'}">${correct(page,ans)?'✓ 정답':'✕ 오답'}</b><p><b>정답:</b> ${esc(q.type==='choice'?q.options[q.answer]:q.answer)}</p><p>${esc(q.explanation)}</p>`:''}</section></div>${done?`<section class="card"><h2>최종 점수: ${score(t)} / 270점</h2><p>일반 문항 ${score(t)-(t.code===SECRET?30:0)}점 · 암호 ${t.code===SECRET?'성공 (+30점)':'실패 (0점)'}</p><button onclick="view='results';render()">전체 결과 확인</button><button onclick="downloadResults()">교사용 결과 파일 저장</button></section>`:''}`);clearInterval(clockHandle);if(!done)clockHandle=setInterval(()=>tickTimer(t),250);if(!done)tickTimer(t)}
function setAnswer(i,val,repaint=true){let t=current();if(!isEditable(t))return;t.answers[i]=val;let auto=syncAutomaticCode(t);save();if(repaint||auto)render();else{let nav=document.querySelectorAll('.nav button')[i];if(nav)nav.classList.toggle('answered',isFilled(val))}}
function setCode(v){let t=current();if(!isEditable(t)||t.phase!=='coop'||count(t)===24)return;t.code=v.toUpperCase().replace(/[^A-Z]/g,'').slice(0,6);save()}
let warned60=false;
function tickTimer(t){if(t!==current()||!isEditable(t))return;let sec=remaining(t),el=document.getElementById('timer');if(el){el.textContent=formatTime(sec);el.classList.toggle('urgent',t.phase==='coop'&&sec<=10);}
let notice=document.getElementById('countdownNotice');if(notice){let msg='';if(t.phase==='coop'&&count(t)<24&&sec<=60&&sec>40)msg='⚠️ 협력 시간 1분 남았습니다! 남은 문제를 빨리 풀고 암호를 맞히세요.';if(t.phase==='coop'&&sec<=40&&count(t)<24)msg='🔓 40초 남았습니다! 암호 수첩이 공개되었습니다. 단서를 조합하세요.';notice.textContent=msg;notice.classList.toggle('hidden',!msg)}
if(t.phase==='coop'&&sec<=40&&!t.cluesUnlocked){t.cluesUnlocked=true;save();render();return}
if(sec<=0){clearInterval(clockHandle);if(t.phase==='relay')advanceRound(true);else if(t.phase==='coop')expireCoop(t)}}
function showTimeUp(msg){document.getElementById('overlay').innerHTML=`<div class="modal"><section class="card"><div class="lock">⏰</div><h2>시간 종료</h2><p>${esc(msg)}</p><button class="primary" onclick="closeOverlay()">확인</button></section></div>`;try{let ac=new(window.AudioContext||window.webkitAudioContext)(),o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=660;g.gain.value=.05;o.start();o.stop(ac.currentTime+.25)}catch{}}
function closeOverlay(){document.getElementById('overlay').innerHTML=''}
function advanceRound(automatic=false){let t=current();if(!t||t.phase!=='relay')return;if(!automatic&&!confirm(`${t.runner}번 주자의 풀이를 종료할까요?`))return;if(t.runner<data.settings.runners){t.runner++;t.nextPhase='relay'}else{t.nextPhase='coop'}pauseForNext(t)}
function changeRunner(){let t=current();if(!t)return;if(t.phase==='relay')advanceRound();else if(t.phase==='coop'){if(!confirm('협력 풀이를 종료하고 최종 제출하시겠습니까?'))return;submitTeam()}}
function submitTeam(){let t=current();if(!isEditable(t)||t.phase!=='coop')return;if(!window.confirm(`현재 작성한 ${count(t)}개 답안과 암호를 최종 제출할까요? 제출 후 수정할 수 없습니다.`))return;t.phase='submitted';t.submittedAt=Date.now();clearInterval(clockHandle);save();sendResult(t);render();document.getElementById('overlay').innerHTML=`<div class="modal"><section class="card"><div class="lock">${t.code===SECRET?'🔓':'🔒'}</div><h2>${t.code===SECRET?'ECONOMY CORE 복구 성공!':'미션 결과가 도착했습니다'}</h2><p>${esc(data.active)} · ${score(t)}점 / 270점</p><p>24문항 중 <b>${t.answers.filter((a,i)=>correct(i,a)).length}문항 정답</b> · ${t.code===SECRET?'최종 암호 해독 성공!':'최종 암호 불일치'}</p><p class="small">교사 모드의 결과표 및 결과 JSON에서도 이 기기의 제출 결과를 확인할 수 있습니다.</p><button class="primary" onclick="closeOverlay()">결과 확인</button></section></div>`}
function toggleAnswerKey(){document.getElementById('answerKey').classList.toggle('hidden')}function renderResults(){let arr=[...Object.entries(data.teams),...Object.entries(data.importedTeams||{}).filter(([n])=>!data.teams[n])].filter(([n,t])=>t.phase==='submitted'||t.phase==='expired').sort((a,b)=>score(b[1])-score(a[1])||((a[1].code===SECRET?a[1].submittedAt:Infinity)-(b[1].code===SECRET?b[1].submittedAt:Infinity)));app(`<section class="card"><span class="pill">FINAL SCOREBOARD</span><h2>🏆 탈출 결과</h2><p class="small sub">이 기기에 저장된 모둠만 표시됩니다. 동점 시 암호 해독 성공 모둠을 우선하고, 둘 다 성공했다면 먼저 제출한 모둠이 앞섭니다.</p><table class="results"><thead><tr><th>순위</th><th>모둠</th><th>문항 점수</th><th>암호</th><th>합계</th></tr></thead><tbody>${arr.map(([n,t],i)=>`<tr><td>${i+1}</td><td>${esc(n)}</td><td>${score(t)-(t.code===SECRET?30:0)}</td><td>${t.code===SECRET?'성공':'실패'}</td><td><b>${score(t)}</b></td></tr>`).join('')||'<tr><td colspan="5">제출한 모둠이 없습니다.</td></tr>'}</tbody></table><div class="spacer"></div><button onclick="goHome()">처음으로</button></section>`)}
function importResultsFile(input){let file=input.files&&input.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let payload=JSON.parse(reader.result);if(!Array.isArray(payload.results))throw Error('결과 배열이 없습니다.');data.importedTeams=data.importedTeams||{};let added=0;for(let row of payload.results){if(!row||typeof row.name!=='string'||!Array.isArray(row.answers)||row.answers.length!==24||!['submitted','expired'].includes(row.phase))continue;let name=row.name.trim();if(!name||name.length>30||data.teams[name])continue;let existing=data.importedTeams[name];if(existing&&Number(existing.submittedAt)>=Number(row.submittedAt))continue;data.importedTeams[name]={answers:row.answers.map(v=>String(v??'')),phase:row.phase,code:String(row.code||'').toUpperCase(),submittedAt:Number(row.submittedAt)||Date.now(),runner:Number(row.runner)||1};added++}save();render();alert(added+'개 모둠 결과를 가져왔습니다. 같은 이름의 이 기기 기록은 덮어쓰지 않습니다.')}catch(e){alert('결과 파일을 읽을 수 없습니다: '+e.message)}};reader.readAsText(file)}
function downloadResults(){let rows=Object.entries(data.teams).map(([name,t])=>({name,phase:t.phase,runner:t.runner,answered:count(t),questionScore:score(t)-(t.code===SECRET?30:0),escapeSuccess:t.code===SECRET,total:score(t),submittedAt:t.submittedAt,code:t.code,answers:t.answers}));let b=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),results:rows},null,2)],{type:'application/json'}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download='economy_escape_results.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}function resetAll(){if(!confirm('이 기기의 모든 모둠 답안과 점수를 삭제합니다. 계속할까요?'))return;if(!confirm('정말로 모든 기록을 초기화할까요? 복구할 수 없습니다.'))return;data.teams={};data.importedTeams={};data.active=null;save();render()}
render();
</script></body></html>
